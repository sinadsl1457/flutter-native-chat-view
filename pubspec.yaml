name: native_chat_view
description: "Chat message list rendered natively (Android RecyclerView / iOS UITableView) inside Flutter via PlatformView."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  injectable: ^2.4.1
  freezed_annotation: ^3.1.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  logger: ^2.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.15
  freezed: ^3.2.3
  injectable_generator: ^2.4.1

  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
